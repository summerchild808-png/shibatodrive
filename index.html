<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>忠犬しばとのお迎え大作戦</title>

  <!-- Google Analytics 4 (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX');
  </script>

  <style>
    * {
      box-sizing: border-box;
      touch-action: none; /* スマホのダブルタップズーム等を無効化 */
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #gameContainer {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background-color: #111;
    }
  </style>
</head>
<body>

<div id="gameContainer">
  <canvas id="gameCanvas" width="960" height="450"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- 画像素材のロード ---
const images = {};
const imageSources = {
  bgSky: 'bg_sky.png',
  bgNightSky: 'bg_night_sky.jpeg',
  bgTown: 'bg_town.png',
  bgPark: 'bg_park.png',
  bgYatai: 'bg_yatai.png',
  bgTower: 'bg_tower.png',
  monsterMentaiko: 'moster_mentaiko.png',
  road: 'road.png',
  titleCard: 'title_card.jpeg',
  openingStory: 'opening_story.jpeg',
  endCardFukuoka: 'end_card_fukuoka.jpeg',
  playerDrive: 'player.png',
  playerJumpPrep: 'player_jump_prep.png',
  playerJump: 'player_jump.png',
  playerLand: 'player_land.png',
  hitchhiker: 'hitchihiker.png',
  mechanic: 'mechanic.png',
  truck: 'obstacle_truck.png',
  manhole: 'obstacle_manhole.png',
  heart: 'ui_heart.png',
  bone: 'ui_bone_coin.png',
  selectRoute: 'select_route.png'
};

let loadedCount = 0;
const totalImages = Object.keys(imageSources).length;
let isGameStarted = false;

for (let src in imageSources) {
  images[src] = new Image();
  images[src].src = imageSources[src];
  images[src].onload = checkProgress;
  images[src].onerror = function() {
    let currentSrc = imageSources[src];
    if (currentSrc.endsWith('.jpeg')) {
      imageSources[src] = currentSrc.replace('.jpeg', '.jpg');
      images[src].src = imageSources[src];
    } else if (currentSrc.endsWith('.jpg')) {
      imageSources[src] = currentSrc.replace('.jpg', '.png');
      images[src].src = imageSources[src];
    } else if (currentSrc.endsWith('.png')) {
      imageSources[src] = currentSrc.replace('.png', '.jpeg');
      images[src].src = imageSources[src];
    } else {
      console.warn(`画像の読み込みスキップ: ${imageSources[src]}`);
      checkProgress();
    }
  };
}

function checkProgress() {
  loadedCount++;
  if (loadedCount >= totalImages && !isGameStarted) {
    isGameStarted = true;
    init();
  }
}

// --- ゲーム変数 ---
let gameState = 'TITLE'; 
let currentStage = 1;

let gameSpeed = 5.2; 
let scoreMoney = 0;
let life = 3;

let currentDistance = 0;
const TOTAL_STAGE_DISTANCE = 12.0; 

let towerX = -200;
let towerPassed = false;
let bgMonsterX = -300;
let skyX = 0;
let townX = 0;
let nightAlpha = 0; 
let endCardTimer = 0;
const END_CARD_DELAY = 120; 

let tutorialTimer = 0;
const TUTORIAL_DURATION = 240; 

const LANES = { 0: 310, 1: 355 };

const player = {
  x: 100,
  lane: 1,
  y: LANES[1],
  targetY: LANES[1],
  width: 120,
  height: 60,
  vy: 0,
  gravity: 0.38,
  jumpPower: -20.0,
  isGrounded: true,
  state: 'DRIVE',
  stateTimer: 0
};

let objects = [];
let popups = [];
let spawnTimer = 0;

function init() {
  const container = document.getElementById('gameContainer');
  
  // スマホ連打時のコンテキストメニュー（右クリックメニュー）を禁止
  window.addEventListener('contextmenu', (e) => e.preventDefault());

  // 入力処理を一箇所にまとめる
  function processInputStart(canvasX, canvasY) {
    if (gameState === 'TITLE') {
      gameState = 'STORY';
    } else if (gameState === 'STORY') {
      resetGame();
      gameState = 'PLAYING';
    } else if (gameState === 'STAGE_CLEAR' && endCardTimer >= END_CARD_DELAY) {
      gameState = 'TITLE';
    } else if (gameState === 'PLAYING') {
      if (canvasX > 760 && canvasY > 280) {
        handleAction(); // 🦘 JUMPボタン
      } else if (canvasY < canvas.height / 2) {
        moveLane(-1); // ▲上（画面上半分タップ）
      } else {
        moveLane(1);  // ▼下（画面下半分タップ）
      }
    } else if (gameState === 'GAMEOVER') {
      gameState = 'TITLE';
    }
  }

  // 📱 スマホ用タッチイベントを追加 (touchstart)
  container.addEventListener('touchstart', (e) => {
    e.preventDefault(); // デフォルトのスクロール等を無効化

    let rect = canvas.getBoundingClientRect();
    // 複数の指のタッチに対応
    for (let i = 0; i < e.touches.length; i++) {
      let touch = e.touches[i];
      let x = (touch.clientX - rect.left) * (canvas.width / rect.width);
      let y = (touch.clientY - rect.top) * (canvas.height / rect.height);
      processInputStart(x, y);
    }
  }, { passive: false }); // passive: false にしないと e.preventDefault() が効かない

  // 🖱️ PC用クリックイベント (mousedown)
  container.addEventListener('mousedown', (e) => {
    e.preventDefault(); // 連打時のテキスト選択等を防止

    let rect = canvas.getBoundingClientRect();
    let x = (e.clientX - rect.left) * (canvas.width / rect.width);
    let y = (e.clientY - rect.top) * (canvas.height / rect.height);
    processInputStart(x, y);
  });

  // キーボード操作はそのまま維持
  document.addEventListener('keydown', (e) => {
    if (e.code === 'ArrowUp' || e.code === 'KeyW') moveLane(-1);
    else if (e.code === 'ArrowDown' || e.code === 'KeyS') moveLane(1);
    else if (e.code === 'Space') {
      e.preventDefault(); // スペースキーによるスクロールを防止
      handleAction();
    }
  });

  if (typeof gtag === 'function') gtag('event', 'game_load', { 'game_title': '忠犬しばとのお迎え大作戦' });
  gameLoop();
}

// 車線変更処理
function moveLane(dir) {
  if (gameState === 'PLAYING') {
    let newLane = player.lane + dir;
    if (newLane >= 0 && newLane <= 1) {
      player.lane = newLane;
      player.targetY = LANES[newLane];
    }
  }
}

// ジャンプ処理
function handleAction() {
  if (gameState === 'PLAYING' && player.isGrounded) {
    player.state = 'PREP';
    player.stateTimer = 2; // 2フレーム溜めてから飛ぶ
  }
}

// ゲームリセット（福岡ステージ）
function resetGame() {
  currentStage = 1;
  currentDistance = 0;
  gameSpeed = 5.2;
  life = 3;
  scoreMoney = 0;
  objects = [];
  popups = [];
  towerX = -200;
  towerPassed = false;
  bgMonsterX = -300;
  nightAlpha = 0;
  endCardTimer = 0;
  tutorialTimer = TUTORIAL_DURATION;
  player.lane = 1;
  player.y = LANES[1];
  player.targetY = LANES[1];
}

function addPopup(text, color, x, y) {
  popups.push({ text: text, color: color, x: x, y: y, alpha: 1.0, life: 90 });
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

function update() {
  if (gameState === 'STAGE_CLEAR') {
    endCardTimer++;
    return;
  }

  if (gameState !== 'PLAYING') return;

  if (tutorialTimer > 0) tutorialTimer--;
  currentDistance += 0.010;

  if (currentDistance < 4.0) gameSpeed = 5.2;
  else if (currentDistance < 8.0) gameSpeed = 6.8;
  else gameSpeed = 8.2;

  if (currentDistance >= TOTAL_STAGE_DISTANCE) {
    currentDistance = TOTAL_STAGE_DISTANCE;
    gameState = 'STAGE_CLEAR';
    endCardTimer = 0;
    return;
  }

  skyX = (skyX - gameSpeed * 0.15) % canvas.width;
  townX = (townX - gameSpeed * 0.5) % canvas.width;

  if (currentDistance >= 7.0) nightAlpha = Math.min(1, nightAlpha + 0.005);

  if (currentDistance >= 2.5 && currentDistance < 4.0 && !towerPassed) {
    if (towerX === -200) towerX = canvas.width;
    towerX -= gameSpeed * 0.4;
    if (towerX + 150 < 0) towerPassed = true;
  }

  if (currentDistance >= 8.5 && currentDistance < 11.0) {
    if (bgMonsterX === -300) bgMonsterX = canvas.width;
    bgMonsterX -= gameSpeed * 0.3;
  } else {
    bgMonsterX = -300;
  }

  // しばとの移動と状態管理
  player.y += (player.targetY - player.y) * 0.35; // ヌルっと動く車線変更

  if (player.state === 'PREP') {
    player.stateTimer--;
    if (player.stateTimer <= 0) {
      player.vy = player.jumpPower;
      player.isGrounded = false;
      player.state = 'JUMP';
    }
  }

  if (!player.isGrounded) {
    player.vy += player.gravity;
    player.y += player.vy;
    if (player.y >= player.targetY) {
      player.y = player.targetY;
      player.vy = 0;
      player.isGrounded = true;
      player.state = 'LAND';
      player.stateTimer = 3;
    }
  } else if (player.state === 'LAND') {
    player.stateTimer--;
    if (player.stateTimer <= 0) player.state = 'DRIVE';
  }

  // ポップアップテキストの更新
  for (let i = popups.length - 1; i >= 0; i--) {
    let p = popups[i];
    p.y -= 0.6;
    if (p.life < 30) p.alpha -= 0.033;
    p.life--;
    if (p.life <= 0) popups.splice(i, 1);
  }

  // オブジェクトの生成
  spawnTimer++;
  let spawnThreshold = 90 - Math.floor(gameSpeed * 3.0);
  if (spawnTimer > spawnThreshold) {
    spawnTimer = 0;
    let spawnLane = Math.floor(Math.random() * 2);
    let rand = Math.random();
    let selectedType = 'hitchhiker';

    if (rand < 0.55) selectedType = 'hitchhiker';
    else if (rand < 0.70) selectedType = 'mechanic';
    else if (rand < 0.82) selectedType = 'truck';
    else if (rand < 0.92) selectedType = 'manhole';
    else selectedType = 'monster_block';

    let objData = {
      type: selectedType,
      lane: spawnLane,
      x: canvas.width,
      y: LANES[spawnLane],
      width: 45,
      height: 65
    };

    if (selectedType === 'truck') { objData.y = LANES[spawnLane] - 10; objData.width = 135; objData.height = 70; }
    else if (selectedType === 'manhole') { objData.y = LANES[spawnLane] + 35; objData.width = 60; objData.height = 20; }
    else if (selectedType === 'monster_block') { objData.lane = 'ALL'; objData.y = LANES[0] - 5; objData.width = 80; objData.height = 85; }

    objects.push(objData);
  }

  // オブジェクトの移動と衝突判定
  for (let i = objects.length - 1; i >= 0; i--) {
    let obj = objects[i];
    obj.x -= gameSpeed;

    let isSameLane = (player.lane === obj.lane || obj.lane === 'ALL');
    if (
      isSameLane &&
      player.x < obj.x + obj.width &&
      player.x + player.width > obj.x &&
      player.isGrounded
    ) {
      if (obj.type === 'hitchhiker') {
        scoreMoney += 1000;
        addPopup('乗車完了！ +¥1,000', '#FFD700', player.x + 10, player.y - 20);
      } else if (obj.type === 'mechanic') {
        scoreMoney += 2000;
        if (life < 3) life++;
        addPopup('車両点検完了！ +¥2,000', '#00FF7F', player.x + 10, player.y - 20);
      } else {
        life--;
        addPopup('クラッシュ！', '#FF4444', player.x + 20, player.y - 20);
        if (life <= 0) gameState = 'GAMEOVER';
      }
      objects.splice(i, 1);
      continue;
    }

    if (obj.x + obj.width < -150) objects.splice(i, 1);
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  function safeDraw(img, x, y, w, h, alpha = 1) {
    if (img && img.complete && img.naturalWidth !== 0) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.drawImage(img, x, y, w, h);
      ctx.restore();
    }
  }

  // 背景描画（昼夜遷移付き）
  safeDraw(images.bgSky, skyX, 0, canvas.width, canvas.height, 1 - nightAlpha);
  safeDraw(images.bgSky, skyX + canvas.width, 0, canvas.width, canvas.height, 1 - nightAlpha);
  safeDraw(images.bgNightSky, skyX, 0, canvas.width, canvas.height, nightAlpha);
  safeDraw(images.bgNightSky, skyX + canvas.width, 0, canvas.width, canvas.height, nightAlpha);

  if (bgMonsterX > -300 && bgMonsterX < canvas.width) safeDraw(images.monsterMentaiko, bgMonsterX, 60, 180, 220);

  let currentBg = images.bgTown;
  if (currentDistance >= 4.0 && currentDistance < 8.0) currentBg = images.bgPark;
  else if (currentDistance >= 8.0) currentBg = images.bgYatai;

  const townHeight = 330; 
  const townY = canvas.height - townHeight;
  safeDraw(currentBg, townX, townY, canvas.width, townHeight);
  safeDraw(currentBg, townX + canvas.width, townY, canvas.width, townHeight);

  if (towerX > -200 && towerX < canvas.width) safeDraw(images.bgTower, towerX, 80, 120, 280);

  // 道路描画
  safeDraw(images.road, 0, 310, canvas.width, 140);

  // オブジェクトとプレイヤーの重ね合わせ描画
  let renderList = [...objects, { isPlayer: true, y: player.y }];
  renderList.sort((a, b) => a.y - b.y);

  renderList.forEach(item => {
    if (item.isPlayer) {
      let currentPlayerImg = images.playerDrive;
      if (player.state === 'PREP') currentPlayerImg = images.playerJumpPrep;
      else if (player.state === 'JUMP') currentPlayerImg = images.playerJump;
      else if (player.state === 'LAND') currentPlayerImg = images.playerLand;
      safeDraw(currentPlayerImg, player.x, player.y, player.width, player.height);
    } else {
      let img = images.hitchhiker;
      if (item.type === 'mechanic') img = images.mechanic;
      else if (item.type === 'truck') img = images.truck;
      else if (item.type === 'manhole') img = images.manhole;
      else if (item.type === 'monster_block') img = images.monsterMentaiko;
      safeDraw(img, item.x, item.y, item.width, item.height);
    }
  });

  // UI描画
  if (gameState === 'PLAYING') {
    safeDraw(images.bone, 20, 20, 35, 35);
    ctx.fillStyle = '#FFD700'; ctx.font = 'bold 24px sans-serif';
    ctx.fillText(`¥${scoreMoney}`, 65, 47);
    for (let i = 0; i < life; i++) safeDraw(images.heart, 820 + (i * 35), 20, 30, 30);

    // 操作UIボタン（半透明グレー）
    ctx.save();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)'; // 20%透明なグレー
    ctx.strokeStyle = '#FFF'; ctx.lineWidth = 2;
    // ▲上ボタン
    ctx.beginPath(); ctx.roundRect(15, 280, 110, 70, 12); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#FFF'; ctx.font = 'bold 24px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('▲ 上', 70, 323);
    // ▼下ボタン
    ctx.beginPath(); ctx.roundRect(15, 360, 110, 70, 12); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#FFF'; ctx.font = 'bold 24px sans-serif';
    ctx.fillText('▼ 下', 70, 403);
    // 🦘 JUMPボタン
    ctx.fillStyle = 'rgba(255, 215, 0, 0.8)'; // 金色
    ctx.strokeStyle = '#FFF'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect(800, 310, 120, 120, 20); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#000'; ctx.font = 'bold 22px sans-serif';
    ctx.fillText('🦘 JUMP', 860, 380);
    ctx.restore();

    // チュートリアル表示
    if (tutorialTimer > 0) {
      ctx.save();
      ctx.globalAlpha = Math.min(1.0, tutorialTimer / 60); // フェードアウト
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(canvas.width / 2 - 250, 150, 500, 150);
      ctx.fillStyle = '#FFF'; ctx.font = '22px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('左側タップ か ⬆⬇キー で車線変更', canvas.width / 2, 195);
      ctx.fillText('右側タップ か スペースキー でジャンプ', canvas.width / 2, 235);
      ctx.fillText('ヒッチハイカーを乗せて稼げ！', canvas.width / 2, 275);
      ctx.restore();
    }
  }

  // ポップアップテキスト描画
  popups.forEach(p => {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.alpha);
    ctx.fillStyle = p.color; ctx.font = 'bold 22px sans-serif';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 5; // 黒縁
    ctx.strokeText(p.text, p.x, p.y); ctx.fillText(p.text, p.x, p.y);
    ctx.restore();
  });

  // 各種画面カード
  if (gameState === 'TITLE') {
    safeDraw(images.titleCard, 0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#FFF'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center'; ctx.strokeStyle = '#000'; ctx.lineWidth = 5;
    ctx.strokeText('画面タップ か スペースキー でスタート！', canvas.width / 2, 400); ctx.fillText('画面タップ か スペースキー でスタート！', canvas.width / 2, 400);
  }

  if (gameState === 'STORY') {
    safeDraw(images.openingStory, 0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#FFF'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center'; ctx.strokeStyle = '#000'; ctx.lineWidth = 5;
    ctx.strokeText('タップして出発！', canvas.width / 2, 420); ctx.fillText('タップして出発！', canvas.width / 2, 420);
  }

  if (gameState === 'STAGE_CLEAR') {
    safeDraw(images.endCardFukuoka, 0, 0, canvas.width, canvas.height);
    if (endCardTimer >= END_CARD_DELAY) {
      ctx.fillStyle = '#FFF'; ctx.font = '20px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('タップして次へ進む', canvas.width / 2, 410);
    }
  }

  if (gameState === 'GAMEOVER') {
    ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#FF4444'; ctx.font = 'bold 36px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width / 2, 200);
    ctx.fillStyle = '#FFF'; ctx.font = '20px sans-serif';
    ctx.fillText('タップでリトライ', canvas.width / 2, 260);
  }
}
</script>

</body>
</html>
